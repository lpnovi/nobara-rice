# Generated by scripts/backup.sh from ~/.config/kwinrc — only rice-related keys.
# Applied key-by-key with kwriteconfig6 by scripts/install.sh (other keys untouched).

[KDE]
AnimationDurationFactor=0.75

[NightColor]
Active=true
NightTemperature=4400

[Plugins]
kwin6_effect_rippleEnabled=true
magiclampEnabled=true
wobblywindowsEnabled=true
translucencyEnabled=true
scaleEnabled=false
squashEnabled=false
shakecursorEnabled=false
kwin_gesturesEnabled=true
ghostty-geometryEnabled=true

[Round-Corners]
Size=10

[Effect-overview]
BorderActivate=9

[TouchEdges]
Top=LockScreen

[org.kde.kdecoration2]
library=org.kde.breeze
theme=Breeze
BorderSize=Normal
BorderSizeAuto=false
ButtonsOnRight=HIAX

